      - name: APK yığ
        run: bash patch.sh && gradle -p _apk assembleDebug --no-daemon --stacktrace

      - name: Release-ə yüklə
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp _apk/app/build/outputs/apk/debug/app-debug.apk Kitabxanam.apk
          gh release create "apk-${{ github.run_number }}" Kitabxanam.apk --target "${{ github.sha }}" --title "Kitabxanam APK ${{ github.run_number }}" --notes "APK-nı yüklə və qur."
