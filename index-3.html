<script>
/* ================= IndexedDB (köhnə məlumatlar qorunur; yalnız 'ann' anbarı əlavə olunub) ================= */
const DB_NAME='kitabxana_v33', DB_VERSION=2; let dbPromise=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{const db=e.target.result;
      if(!db.objectStoreNames.contains('folders')) db.createObjectStore('folders',{keyPath:'id'});
      if(!db.objectStoreNames.contains('media')){const s=db.createObjectStore('media',{keyPath:'id'});s.createIndex('folderId','folderId');s.createIndex('isFavorite','isFavorite');}
      if(!db.objectStoreNames.contains('ann')) db.createObjectStore('ann',{keyPath:'id'});};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);});
  return dbPromise;
}
async function dbReq(store,mode,fn){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});}
const dbGetAllFolders=()=>dbReq('folders','readonly',o=>o.getAll());
const dbGetFolder=id=>dbReq('folders','readonly',o=>o.get(id));
const dbAddFolder=f=>dbReq('folders','readwrite',o=>o.add(f));
const dbUpdateFolder=f=>dbReq('folders','readwrite',o=>o.put(f));
async function dbDeleteFolder(id){const db=await openDB();const tx=db.transaction(['folders','media','ann'],'readwrite');
  tx.objectStore('folders').delete(id);
  tx.objectStore('media').index('folderId').openCursor(IDBKeyRange.only(id)).onsuccess=e=>{const c=e.target.result;if(c){tx.objectStore('ann').delete(c.value.id);tx.objectStore('ann').delete('pos:'+c.value.id);localStorage.removeItem('pos:'+c.value.id);c.delete();c.continue();}};
  return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
const dbGetMedia=fid=>dbReq('media','readonly',o=>o.index('folderId').getAll(IDBKeyRange.only(fid)));
async function dbGetFavorites(){return (await dbReq('media','readonly',o=>o.getAll())).filter(m=>m.isFavorite===true);}
const dbAddMedia=m=>dbReq('media','readwrite',o=>o.add(m));
const dbUpdateMedia=m=>dbReq('media','readwrite',o=>o.put(m));
async function dbDeleteMedia(id){await dbReq('media','readwrite',o=>o.delete(id));await dbReq('ann','readwrite',o=>o.delete(id));await dbReq('ann','readwrite',o=>o.delete('pos:'+id));localStorage.removeItem('pos:'+id);}
const dbCountMedia=fid=>dbReq('media','readonly',o=>o.index('folderId').count(IDBKeyRange.only(fid)));
const dbGetAnn=async id=>{const r=await dbReq('ann','readonly',o=>o.get(id));return r?r.strokes:[];};
const dbPutAnn=(id,strokes)=>dbReq('ann','readwrite',o=>o.put({id,strokes}));

const SORT_IDS=['date_desc','date_asc','name_asc','name_desc','size_desc','size_asc'];
const getSortFor=id=>{try{const v=localStorage.getItem('sort:'+id);return SORT_IDS.includes(v)?v:'date_desc';}catch(e){return 'date_desc';}};
const setSortFor=(id,v)=>{try{localStorage.setItem('sort:'+id,v);}catch(e){}};
const state={folders:[],folderCounts:{},currentFolder:null,currentMediaList:[],currentSort:'date_desc',blobUrls:[],coverUrls:{},prevTotalCount:0};
let coverTargetId=null;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const revokeBlobUrls=()=>{state.blobUrls.forEach(u=>URL.revokeObjectURL(u));state.blobUrls=[];};
const revokeCovers=()=>{Object.values(state.coverUrls).forEach(u=>URL.revokeObjectURL(u));state.coverUrls={};};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000);}
function showModal(html,center=false){const o=$('#modalOverlay');o.classList.toggle('center',center);$('#modalBox').innerHTML=html;o.classList.add('active');}
function hideModal(){$('#modalOverlay').classList.remove('active');$('#modalBox').style.maxWidth='';if(window._mc){const f=window._mc;window._mc=null;f();}}
function attachLongPress(el,cb){let timer=null,trig=false;
  const start=()=>{trig=false;timer=setTimeout(()=>{trig=true;if(navigator.vibrate)navigator.vibrate(30);cb();},550);};
  const cancel=()=>clearTimeout(timer);
  el.addEventListener('touchstart',start,{passive:true});['touchend','touchmove','touchcancel','mouseup','mouseleave'].forEach(n=>el.addEventListener(n,cancel));
  el.addEventListener('mousedown',start);el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',e=>{if(trig){e.stopPropagation();e.preventDefault();trig=false;}},true);}
const getFolderName=id=>{const f=state.folders.find(f=>f.id===id);return f?f.name:'Naməlum Bölmə';};

/* ================= Naviqasiya: hər addım history-yə yazılır, geri düyməsi bir pillə geri qaytarır ================= */
history.replaceState({screen:'home'},'');
window.addEventListener('popstate',()=>{
  if(!$('#viewerScreen').classList.contains('hidden')) closeViewer();
  else if(!$('#folderScreen').classList.contains('hidden')) closeFolder();
});

/* ================= Thumbnail-lar ================= */
function imageThumb(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const w=320,c=document.createElement('canvas');c.width=w;c.height=Math.round(w*im.naturalHeight/im.naturalWidth)||w;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.6);c.width=0;URL.revokeObjectURL(u);res(d);};
  im.onerror=()=>{URL.revokeObjectURL(u);res(null);};im.src=u;});}
// Video: ilk saniyədən (və ya ortadan) avtomatik üz qabığı
function generateVideoThumbnail(file){return new Promise(res=>{const v=document.createElement('video'),u=URL.createObjectURL(file);let done=false;
  const fin=d=>{if(done)return;done=true;URL.revokeObjectURL(u);v.removeAttribute('src');v.load();res(d);};
  v.muted=true;v.playsInline=true;v.preload='auto';
  v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2);};
  v.onseeked=()=>{try{const w=320,c=document.createElement('canvas');c.width=w;c.height=Math.round(w*v.videoHeight/v.videoWidth)||180;
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.6);c.width=0;fin(d);}catch(e){fin(null);}};
  v.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);v.src=u;});}

/* ================= Ana səhifə (rəf) ================= */
async function loadHome(){
  state.folders=await dbGetAllFolders();state.folders.sort((a,b)=>b.createdAt-a.createdAt);
  const counts=await Promise.all(state.folders.map(f=>dbCountMedia(f.id)));
  state.folderCounts={};state.folders.forEach((f,i)=>state.folderCounts[f.id]=counts[i]);
  renderShelf();$('#palmNumber').textContent=state.folders.length;
  const total=state.folders.reduce((s,f)=>s+(state.folderCounts[f.id]||0),0);
  $('#homeSub').textContent=`${state.folders.length} bölmə • ${total} element`;
  $('#favCountBadge').textContent=(await dbGetFavorites()).length;
}
function renderShelf(){
  const row=$('#shelfRow');revokeCovers();row.innerHTML='';
  if(!state.folders.length){row.innerHTML='<div class="shelf-empty">Rəf boşdur • aşağıdakı düymə ilə<br>ilk bölməni yarat</div>';return;}
  const grads=['linear-gradient(145deg,#2c2c2c,#0d0d0d)','linear-gradient(160deg,#1e1e1e,#050505)','linear-gradient(120deg,#333 0%,#0a0a0a 100%)','linear-gradient(155deg,#262626,#080808)'];
  state.folders.forEach((folder,i)=>{
    const book=document.createElement('div');book.className='book';book.style.setProperty('--i',i);
    if(folder.coverBlob){const url=URL.createObjectURL(folder.coverBlob);state.coverUrls[folder.id]=url;book.style.backgroundImage=`url("${url}")`;}
    else{book.style.background=grads[i%grads.length];const ic=document.createElement('div');ic.className='book-default-icon';ic.textContent='📖';book.appendChild(ic);}
    const count=state.folderCounts[folder.id]||0;
    book.insertAdjacentHTML('beforeend',`<div class="book-gradient"></div><div class="book-count-badge">${count}</div><div class="book-content"><div class="book-name">${escapeHtml(folder.name)}</div><div class="book-count">${count===0?'boş':count+' element'}</div></div>`);
    book.addEventListener('click',()=>openFolder(folder));
    attachLongPress(book,()=>showBookMenu(folder));row.appendChild(book);});
}
$('#openFavoritesBtn').addEventListener('click',()=>openFolder({id:'favorites',name:'Sevimlilər',isSpecial:true}));

function showBookMenu(folder){
  const hasCover=!!folder.coverBlob;const b='padding:14px;text-align:left;background:rgba(255,255,255,0.08);color:#fff;';
  showModal(`<div class="modal-title">${escapeHtml(folder.name)}</div>
    <div style="color:rgba(255,255,255,0.6);font-size:13px;margin-bottom:16px;">${state.folderCounts[folder.id]||0} element</div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <button class="btn" id="menuOpen" style="${b}">📂 Bölməni aç</button>
      <button class="btn" id="menuRename" style="${b}">✏️ Adını dəyiş</button>
      <button class="btn" id="menuCover" style="${b}">🖼️ ${hasCover?'Üz qabığını dəyiş':'Üz qabığı şəkli əlavə et'}</button>
      ${hasCover?`<button class="btn" id="menuRemoveCover" style="${b}">✖️ Üz qabığını sil</button>`:''}
      <button class="btn danger" id="menuDelete" style="padding:14px;text-align:left;background:rgba(255,90,90,0.08);">🗑️ Bölməni sil</button>
    </div><div class="modal-actions"><button class="btn" id="menuCancel">Bağla</button></div>`);
  $('#menuCancel').onclick=hideModal;
  $('#menuOpen').onclick=()=>{hideModal();openFolder(folder);};
  $('#menuRename').onclick=()=>{hideModal();setTimeout(()=>askName('Adı dəyiş',folder.name,async n=>{folder.name=n;await dbUpdateFolder(folder);await loadHome();showToast('Ad dəyişdirildi ✓');}),300);};
  $('#menuCover').onclick=()=>{hideModal();coverTargetId=folder.id;const i=$('#coverInput');i.value='';i.click();};
  const rm=$('#menuRemoveCover');if(rm)rm.onclick=async()=>{hideModal();folder.coverBlob=null;await dbUpdateFolder(folder);await loadHome();showToast('Üz qabığı silindi');};
  $('#menuDelete').onclick=()=>{hideModal();confirmDeleteFolder(folder);};
}
function askName(title,val,onOk,ph=''){
  showModal(`<div class="modal-title">${title}</div><input type="text" class="modal-input" id="nameInput" placeholder="${ph}" value="${escapeHtml(val||'')}"><div class="modal-actions"><button class="btn" id="mCancel">Ləğv et</button><button class="btn primary" id="mOk">Yadda saxla</button></div>`,true);
  const inp=$('#nameInput');setTimeout(()=>inp.focus(),100);$('#mCancel').onclick=hideModal;
  const ok=()=>{const n=inp.value.trim();if(!n)return;hideModal();onOk(n);};
  $('#mOk').onclick=ok;inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok();});
}
$('#coverInput').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file||!coverTargetId)return;
  try{const f=await dbGetFolder(coverTargetId);if(!f)return;f.coverBlob=file;await dbUpdateFolder(f);
    if(state.currentFolder&&state.currentFolder.id===f.id)state.currentFolder.coverBlob=file;await loadHome();showToast('Üz qabığı yeniləndi ✓');}
  catch(err){showToast('Xəta baş verdi');}finally{coverTargetId=null;}
});
$('#addFolderBtn').addEventListener('click',()=>askName('Yeni bölmə','',async n=>{await dbAddFolder({id:'f_'+Date.now(),name:n,createdAt:Date.now()});await loadHome();showToast('Bölmə yaradıldı ✓');},'Bölmənin adı (məs: Riyaziyyat)'));
function confirmDeleteFolder(folder){
  showModal(`<div class="modal-title">Bölməni sil?</div><div style="color:rgba(255,255,255,0.7);font-size:14px;line-height:1.5;"><b>"${escapeHtml(folder.name)}"</b> bölməsi və içindəki bütün elementlər silinəcək.</div><div class="modal-actions"><button class="btn" id="mCancel">Xeyr</button><button class="btn danger" id="mOk">Sil</button></div>`,true);
  $('#mCancel').onclick=hideModal;$('#mOk').onclick=async()=>{hideModal();await dbDeleteFolder(folder.id);await loadHome();showToast('Bölmə silindi');};
}

/* ================= Bölmə ekranı ================= */
async function openFolder(folder){
  state.currentFolder=folder;$('#folderTitle').textContent=folder.name;
  const isFav=folder.id==='favorites';$('#addMediaBtn').style.display=isFav?'none':'flex';$('#changeCoverBtn').style.display=isFav?'none':'flex';
  const home=$('#homeScreen'),fs=$('#folderScreen');
  fs.classList.remove('hidden');fs.classList.add('slide-in-right');home.classList.add('slide-out-left');
  history.pushState({screen:'folder'},'');await renderFolder();
  setTimeout(()=>{home.classList.add('hidden');fs.classList.remove('slide-in-right');},420);
}
async function closeFolder(){
  const home=$('#homeScreen'),fs=$('#folderScreen');
  fs.classList.add('slide-out-right');home.classList.remove('hidden','slide-out-left');home.classList.add('slide-in-left');
  setTimeout(async()=>{fs.classList.add('hidden');fs.classList.remove('slide-out-right');home.classList.remove('slide-in-left');
    revokeBlobUrls();state.currentFolder=null;await loadHome();},420);
}
$('#folderBackBtn').addEventListener('click',()=>history.back());
$('#changeCoverBtn').addEventListener('click',()=>{if(!state.currentFolder||state.currentFolder.id==='favorites')return;coverTargetId=state.currentFolder.id;const i=$('#coverInput');i.value='';i.click();});
$('#sortBtn').addEventListener('click',()=>{
  if(state.currentFolder)state.currentSort=getSortFor(state.currentFolder.id);
  const sorts=[['date_desc','Ən yenidən köhnəyə (Tarix)'],['date_asc','Ən köhnədən yeniyə (Tarix)'],['name_asc','Ad sırası (A-Z / 1-9)'],['name_desc','Ad sırası (Z-A / 9-1)'],['size_desc','Ölçü (Böyükdən kiçiyə)'],['size_asc','Ölçü (Kiçikdən böyüyə)']];
  showModal(`<div class="modal-title">Sıralama seçin</div><div class="sort-list">${sorts.map(([id,l])=>`<div class="sort-item ${state.currentSort===id?'active':''}" data-sort="${id}"><span>${l}</span><span class="sort-check">✓</span></div>`).join('')}</div><div class="modal-actions"><button class="btn" onclick="hideModal()">Bağla</button></div>`);
  document.querySelectorAll('.sort-item').forEach(el=>el.onclick=()=>{state.currentSort=el.dataset.sort;if(state.currentFolder)setSortFor(state.currentFolder.id,state.currentSort);hideModal();renderFolder();});
});
function sortMediaList(media){if(state.currentFolder)state.currentSort=getSortFor(state.currentFolder.id);const list=[...media],s=state.currentSort,col=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
  list.sort((a,b)=>{if(s==='date_desc')return b.createdAt-a.createdAt;if(s==='date_asc')return a.createdAt-b.createdAt;
    if(s==='name_asc')return col.compare(a.name||'',b.name||'');if(s==='name_desc')return col.compare(b.name||'',a.name||'');
    if(s==='size_desc')return(b.size||0)-(a.size||0);return(a.size||0)-(b.size||0);});return list;}

async function renderFolder(){
  if(!state.currentFolder)return;const isFav=state.currentFolder.id==='favorites';
  const media=sortMediaList(isFav?await dbGetFavorites():await dbGetMedia(state.currentFolder.id));
  state.currentMediaList=media;$('#folderSubtitle').textContent=`${media.length} element`;
  const content=$('#folderContent');revokeBlobUrls();
  if(!media.length){content.innerHTML=`<div class="empty"><div class="empty-icon">${isFav?'⭐':'🖼️'}</div><div class="empty-title">${isFav?'Sevimli fayl yoxdur':'Bölmə boşdur'}</div><div class="empty-sub">${isFav?'Hər hansı fayla uzun basıb<br>sevimlilərə əlavə et':'＋ düyməsi ilə foto/video/PDF əlavə et'}</div></div>`;return;}
  content.innerHTML='<div class="media-grid" id="mediaGrid"></div>';const grid=$('#mediaGrid');
  media.forEach((m,i)=>{
    const tile=document.createElement('div');tile.className='media-tile';tile.style.animationDelay=`${Math.min(i,20)*25}ms`;

/* ---- Sərhədlər: kontent kiçikdirsə mərkəzdə, böyükdürsə kənara çıxa bilməz ---- */

  activeSet.forEach(i=>{const p=pages[i],zb=zbOf();if(p.ann&&Math.abs(zb-p.zb)>.25)mkAnn(p,i,zb);});   // zoomdan sonra qeydlər də kəskin
  if(pdf&&!rt&&++settleN%12===0){try{pdf.cleanup(true);}catch(e){}}}

/* ---- Səhifələr ---- */
function build(){sheet.innerHTML='';H=TOP;
  pages.forEach((p,idx)=>{p.i=idx;p.top=H;p.hh=W*p.ratio;const d=document.createElement('div');d.className='pg';
    d.style.cssText=`width:${W}px;height:${p.hh}px;top:${p.top}px`;sheet.appendChild(d);p.el=d;p.on=false;p.tok=0;p.lvl=0;p.rzb=0;H+=p.hh+GAP;});

  [p.canvas,p.ann].forEach(c=>{if(c){c.width=0;c.remove();}});p.canvas=p.ann=null;p.lvl=0;p.rzb=0;}

/* ---- Son mövqe: setTimeout yoxdur, hesablanan kimi dərhal tətbiq olunur ---- */
function putPos(id,o){o.t=Date.now();try{localStorage.setItem('pos:'+id,JSON.stringify(o));}catch(e){}dbPutAnn('pos:'+id,o);}
async function loadPos(id){let a=null,b=null;
  try{a=JSON.parse(localStorage.getItem('pos:'+id)||'null');}catch(e){}
  try{b=await dbGetAnn('pos:'+id);}catch(e){}
  if(Array.isArray(b))b=null;if(typeof a==='number')a={v:a};
  return(a&&b)?((b.t||0)>=(a.t||0)?b:a):(a||b);}
function savePos(){if(!item||kind==='video')return;const rg=Math.max(0,H*s-vh);putPos(item.id,{r:rg>1?clamp(-ty/rg,0,1):0,s});}
function restore(sv){s=sv&&sv.s?clamp(sv.s,1,5):1;const rg=Math.max(0,H*s-vh);ty=sv&&sv.r!=null?-clamp(sv.r,0,1)*rg:0;tx=(vw-W*s)/2;
  const b=bounds();tx=clamp(tx,b.minX,b.maxX);ty=clamp(ty,b.minY,b.maxY);lastVis=1e9;}

/* ---- Faylı açmaq ---- */
function nativeOpen(m){const u=URL.createObjectURL(m.blob),a=document.createElement('a');
  a.href=u;a.target='_blank';a.download=m.name+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);}
$('#nativeBtn').onclick=()=>item&&nativeOpen(item);
async function openViewer(m){
  if(m.type==='pdf'&&typeof pdfjsLib==='undefined'){showToast('İnternet yoxdur – telefonun oxuyucusu ilə açılır');nativeOpen(m);return;}
  lastPokeTy=null;lastPg=0;const my=++tok;item=m;kind=m.type;dirty=false;strokes=[];redo=[];pages=[];activeSet.clear();rt=null;vx=vy=0;
  favBtn.textContent=m.isFavorite?'⭐':'☆';favBtn.style.color=m.isFavorite?'#ffd700':'#fff';
  const vs=$('#viewerScreen');vs.classList.remove('hidden','slide-out-right');vs.classList.add('slide-in-right');
  history.pushState({screen:'viewer'},'');setTimeout(()=>vs.classList.remove('slide-in-right'),420);
  const isVid=kind==='video';document.body.classList.toggle('vidmode',isVid);mediaToolbar.classList.add('show');$('#nativeBtn').style.display=kind==='pdf'?'flex':'none';
  setTool('pan');penSettings.classList.remove('show');sheet.innerHTML='';resize();W=vw;
  if(isVid){openVideo(m);return;}
  const msg=document.createElement('div');msg.className='viewer-msg';msg.innerHTML='<div class="spinner" style="border-top-color:#fff"></div><span>Yüklənir…</span>';vp.appendChild(msg);

      const pgs=await Promise.all(Array.from({length:pdf.numPages},(_,i)=>pdf.getPage(i+1)));
      pages=pgs.map(pg=>{const v=pg.getViewport({scale:1});return{pg,w:v.width,ratio:v.height/v.width};});}
    else{url=URL.createObjectURL(m.blob);const im=new Image();im.src=url;await im.decode();pages=[{ratio:im.naturalHeight/im.naturalWidth,im}];}
  }catch(e){msg.remove();if(my===tok){showToast('Fayl açıla bilmədi');history.back();}return;}
  msg.remove();if(my!==tok){if(pdf){pdf.destroy();pdf=null;}if(url){URL.revokeObjectURL(url);url=null;}return;}
  build();
  if(kind==='image'){const p=pages[0];p.im.removeAttribute('width');p.el.appendChild(p.im);}
  restore(savedPos);updateVisible();paintView();kick();
}
function openVideo(m){

  v.onloadedmetadata=()=>{if(sv>0&&sv<v.duration-1)v.currentTime=sv;$('#customTotalTime').textContent=fmt(v.duration);};
  v.ontimeupdate=()=>{if(Date.now()-lastVSave>3000){lastVSave=Date.now();putPos(m.id,{v:v.currentTime||0});}if(!seeking){seek.value=(v.currentTime/(v.duration||1))*100;$('#customCurrentTime').textContent=fmt(v.currentTime);}};
  v.onplay=()=>$('#customPlayBtn').textContent='⏸️';v.onpause=()=>$('#customPlayBtn').textContent='▶️';
  vp.appendChild(v);const c=$('#customVideoControls');c.classList.add('show');
  c.style.cssText='';seek.value=0;$('#customPlayBtn').textContent='▶️';v.play().catch(()=>{});

}

  else savePos();
  let thumb=null;   // çəkilmiş qeydlər bölmədəki üz qabığında da görünsün
  if(dirty&&pages[0]&&strokes.some(x=>x.p===0)){const p=pages[0],bg=kind==='pdf'?p.canvas:p.im;
    if(bg&&p.ann){try{const c=document.createElement('canvas');c.width=400;c.height=Math.round(400*p.ratio);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      x.drawImage(bg,0,0,c.width,c.height);x.drawImage(p.ann,0,0,c.width,c.height);thumb=c.toDataURL('image/jpeg',.6);c.width=0;}catch(e){}}}

  pages=[];strokes=[];redo=[];ptrs.clear();pan=pin=cur=null;drag=false;vx=vy=0;item=null;
  setTimeout(()=>{vs.classList.add('hidden');vs.classList.remove('slide-out-right');},420);
  if(thumb){m.thumbnail=thumb;await dbUpdateMedia(m);}

/* ---- Çəkiliş: koordinatlar səhifə enine görə normallaşdırılıb (zoomdan asılı olmur) ---- */
function paint(ctx,st,pw,from){const P=st.pts;let i=from||0;if(P.length<2)return;

  else{for(i+=2;i<P.length-2;i+=2)ctx.quadraticCurveTo(P[i]*pw,P[i+1]*pw,(P[i]+P[i+2])/2*pw,(P[i+1]+P[i+3])/2*pw);

function replay(p,i){const x=p.ann.getContext('2d');strokes.forEach(st=>{if(st.p===i)paint(x,st,p.ann.width);});}
function strokeStart(x,y){const i=pageAt((y-ty)/s),p=pages[i];if(!p||!p.on)return;if(!p.ann)mkAnn(p,i,zbOf());
  const T=toolSettings[tool];cur={p:i,t:tool,c:T.color,a:T.opacity,w:T.width/(s*W),pts:[],n:0};
  if(tool!=='eraser'){const l=document.createElement('canvas');l.width=p.ann.width;l.height=p.ann.height;
    l.style.cssText=`position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:${T.opacity}`;p.el.appendChild(l);cur.live=l;}   // şəffaflıq canvas səviyyəsində: marker üst-üstə düşəndə tünd olmur
  addPt(x,y);}
function addPt(x,y){const p=pages[cur.p];cur.pts.push(+(((x-tx)/s)/W).toFixed(4),+((((y-ty)/s)-p.top)/W).toFixed(4));need=true;kick();}
function drawCur(){need=false;const p=pages[cur.p];if(!p||!p.ann)return;
  if(cur.live){const x=cur.live.getContext('2d');x.clearRect(0,0,cur.live.width,cur.live.height);paint(x,{...cur,a:1},cur.live.width);}

  else if(need&&p&&p.ann)paint(p.ann.getContext('2d'),c,p.ann.width,c.n);

// İkiqat toxunuş: böyüt (2.5x, toxunulan nöqtəyə) / geri kiçilt (1x), animasiyalı

/* ============ MƏTN KOPYALA (düsturlar daxil) + SƏHİFƏNİ QALEREYAYA YÜKLƏ ============ */
const curPage=()=>pageAt((-ty+vh/2)/s);
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','−':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ'};
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','−':'₋','=':'₌','(':'₍',')':'₎'};
function conv(str,map,pre){let o='';for(const ch of str){if(!(ch in map))return pre+(str.length>1?'('+str+')':str);o+=map[ch];}return o;}
// Sətirləri qur: eyni xətdə olanları birləşdir, üst/alt indeksləri (x², H₂O) Unicode ilə yaz, boşluqları düzgün qoy
function buildLines(it){
  it.sort((a,b)=>b.y-a.y||a.x-b.x);const L=[];
  for(const t of it){const l=L[L.length-1];
    if(l&&Math.abs(l.y-t.y)<=.45*Math.max(l.f,t.f)){l.items.push(t);if(t.f>l.f){l.f=t.f;l.y=t.y;}}
    else L.push({y:t.y,f:t.f,items:[t]});}
  let out='',py=null,pf=0;
  for(const l of L){l.items.sort((a,b)=>a.x-b.x);let line='',prev=null;
    for(const t of l.items){let str=t.s;const small=t.f<l.f*.8;
      const sup=small&&t.y>l.y+l.f*.18,sub=small&&t.y<l.y-l.f*.12;
      if(sup)str=conv(str.trim(),SUP,'^');else if(sub)str=conv(str.trim(),SUB,'_');
      if(prev&&prev.s.trim()==='√'&&/[\s+\-−×·\/=]/.test(str.trim()))str='('+str.trim()+')';
      if(prev){const gap=t.x-(prev.x+prev.w),sp=/\s$/.test(line)||/^\s/.test(str);
        if(!sp){if(gap>l.f*2.5)line+='   ';else if(gap>l.f*((sup||sub)?.6:.18))line+=' ';}}
      line+=str;prev=t;}
    line=line.replace(/[ \t]+$/,'');if(!line.trim())continue;
    if(py!==null)out+=(py-l.y>1.9*Math.max(l.f,pf))?'\n\n':'\n';
    out+=line;py=l.y;pf=l.f;}

// Üst-alt yazılmış kəsrləri "a/b" formasına gətirir (yalnız yanında normal sətir mətni olanda, yanlış tapmamaq üçün)
function mergeFractions(it,pw){
  const srt=it.slice().sort((a,b)=>b.y-a.y||a.x-b.x),rows=[];
  for(const t of srt){const r=rows[rows.length-1];if(r&&Math.abs(r.y-t.y)<=.3*Math.max(r.f,t.f))r.it.push(t);else rows.push({y:t.y,f:t.f,it:[t]});}
  const G=[];
  for(const r of rows){r.it.sort((a,b)=>a.x-b.x);let g=null;
    for(const t of r.it){if(g&&t.x-g.x1<=.9*Math.max(g.f,t.f)){g.items.push(t);g.x1=Math.max(g.x1,t.x+t.w);g.f=Math.max(g.f,t.f);}
      else{g={items:[t],x0:t.x,x1:t.x+t.w,y:r.y,f:t.f};G.push(g);}}}
  const gtxt=g=>{let o='',pv=null;for(const t of g.items){if(pv&&t.x-(pv.x+pv.w)>.18*g.f&&!/\s$/.test(o))o+=' ';o+=t.s;pv=t;}return o.trim();};
  const wr=x=>/^[\p{L}\p{N}.,√²³]+$/u.test(x)?x:'('+x+')';

      if(dy<.9*f||dy>2.6*f)continue;

      if(Math.abs((U.x0+U.x1)/2-(D.x0+D.x1)/2)>.35*Math.max(wu,wd)+.3*f||Math.max(wu,wd)>pw*.45)continue;
      const x0=Math.min(U.x0,D.x0),x1=Math.max(U.x1,D.x1),ym=(U.y+D.y)/2,tu=gtxt(U),td=gtxt(D);
      if(tu.length>30||td.length>30)continue;
      let base=null,between=false;
      for(const B of G){if(B===U||B===D||used.has(B))continue;
        if(B.y<U.y-.3*f&&B.y>D.y+.3*f&&B.x1>x0&&B.x0<x1){between=true;break;}
        if(Math.abs(B.y-ym)<=.45*f&&((x0-B.x1>=-.3*f&&x0-B.x1<=1.6*f)||(B.x0-x1>=-.3*f&&B.x0-x1<=1.6*f)))base=B;}
      if(between||!base)continue;
      used.add(U);used.add(D);extra.push({s:wr(tu)+'/'+wr(td),x:x0,y:ym,f:Math.max(U.f,D.f),w:x1-x0});break;}}
  if(!extra.length)return it;
  const drop=new Set();used.forEach(g=>g.items.forEach(t=>drop.add(t)));
  return it.filter(t=>!drop.has(t)).concat(extra);}
// Riyazi simvolları səliqəyə sal: sqrt -> √, <= -> ≤, ^2 -> ², x_1 -> x₁ və s.
function normMath(t){
  return t.replace(/[\u00AD\u200B]/g,'').replace(/\u00A0/g,' ').replace(/[\uE000-\uF8FF]/g,'')
    .replace(/\\?sqrt\s*\(/gi,'√(').replace(/\\?sqrt\b\s*/gi,'√').replace(/\bcbrt\b\s*/gi,'∛')
    .replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/!=/g,'≠').replace(/\+-/g,'±').replace(/->/g,'→')
    .replace(/\^\s*\(?(-?\d+)\)?/g,(m,d)=>conv(d,SUP,'^')).replace(/(?<=[\p{L}\d)])_(\d+)/gu,(m,d)=>conv(d,SUB,'_'))
    .replace(/Ö(?=[\d(])/g,'√');}
function composeText(it,pw){it=mergeFractions(it,pw);const mid=pw/2,span=it.filter(t=>t.x<mid-2&&t.x+t.w>mid+2).length;
  const Lc=it.filter(t=>t.x+t.w/2<mid),Rc=it.filter(t=>t.x+t.w/2>=mid);
  const two=it.length>40&&span<it.length*.05&&Lc.length>it.length*.25&&Rc.length>it.length*.25;   // 2 sütunlu səhifə: əvvəl sol, sonra sağ
  return two?buildLines(Lc)+'\n\n'+buildLines(Rc):buildLines(it);}
async function pageText(i){
  const pg=pages[i],tc=await pg.pg.getTextContent();
  const it=tc.items.filter(t=>t.str&&t.str.trim()!=='').map(t=>({s:t.str,x:t.transform[4],y:t.transform[5],f:Math.hypot(t.transform[2],t.transform[3])||t.height||10,w:t.width||0}));
  return normMath(composeText(it,pg.w).replace(/(\p{L})-\n(\p{Ll})/gu,'$1$2').trim());}

/* ---- Birbaşa seçim (adi PDF tətbiqləri kimi): səhifə üzərində şəffaf, seçilə bilən mətn qatı ---- */
const textPages=[];
function dropText(p){if(!p||!p.tl)return;try{p.tt&&p.tt.cancel();}catch(e){}p.tl.remove();p.tl=null;p.tt=null;}
async function mkText(i){const p=pages[i];
  if(kind!=='pdf'||!p||p.tl||!p.on||!window.pdfjsLib||typeof pdfjsLib.renderTextLayer!=='function')return;
  const d=document.createElement('div');d.className='tl';p.tl=d;p.el.appendChild(d);
  try{const tc=await p.pg.getTextContent();if(p.tl!==d||!p.on)return;
    d.style.setProperty('--scale-factor',W/p.w);

  let st=null;
  try{
    const mw=1100,k=Math.min(1,mw/canvas.width),sm=document.createElement('canvas');   // WebView panosu böyük məlumatı qəbul etmir – ölçünü kiçilt
    sm.width=Math.max(1,Math.round(canvas.width*k));sm.height=Math.max(1,Math.round(canvas.height*k));
    const x=sm.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sm.width,sm.height);x.drawImage(canvas,0,0,sm.width,sm.height);
    const dataUrl=sm.toDataURL('image/jpeg',.88);sm.width=0;
    st=document.createElement('div');st.id='cpStage';st.contentEditable='true';
    const im=new Image();im.src=dataUrl;st.appendChild(im);document.body.appendChild(st);
    try{await im.decode();}catch(e){}
    window._imgCopy=true;
    st.focus();const rg=document.createRange();rg.selectNode(im);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(rg);
    const ok=document.execCommand('copy');
    sel.removeAllRanges();st.remove();st=null;
    setTimeout(()=>{window._imgCopy=false;},300);
    return ok?'html':false;
  }catch(e){if(st)st.remove();window._imgCopy=false;return false;}}
$('#cbCopy').onclick=async()=>{if(!csel)return;
  if(navigator.clipboard&&window.ClipboardItem){   // Chrome: kopyalama əmri toxunuşla eyni anda verilir, şəkil sonra hazırlanır
    showToast('Hazırlanır…');
    try{const bp=cropImage().then(c=>toBlob(c,'image/png').then(b=>{c.width=0;if(!b)throw new Error('şəkil alınmadı');return b;}));
      await navigator.clipboard.write([new ClipboardItem({'image/png':bp})]);showToast('Şəkil panoya kopyalandı ✓');return;}catch(e){}}
  showToast('Hazırlanır…');
  try{const c=await cropImage(),blob=await toBlob(c,'image/png');if(!blob){c.width=0;throw new Error('şəkil alınmadı');}
    const r=await copyImageToClipboard(c,blob);c.width=0;
    if(r==='api')showToast('Şəkil panoya kopyalandı ✓');
    else if(r==='html')showToast('Kopyalandı ✓ – yapışmasa «📤 Paylaş» istifadə et');
    else offerImage(blob,safeName('secim','png'),'Bu cihazda şəkli panoya kopyalamaq alınmadı');}
  catch(e){showToast('Alınmadı: '+(e.message||'xəta'));}};
$('#cbShare').onclick=async()=>{if(!csel)return;showToast('Hazırlanır…');
  try{const c=await cropImage(),blob=await toBlob(c,'image/png');c.width=0;if(!blob)throw new Error('şəkil alınmadı');
    const name=safeName('secim','png'),file=new File([blob],name,{type:'image/png'});
    if(navigator.share){try{await navigator.share({files:[file]});return;}catch(err){if(err&&err.name==='AbortError')return;}}
    offerImage(blob,name,'Seçilmiş hissə hazırdır');}
  catch(e){showToast('Alınmadı: '+(e.message||'xəta'));}};
$('#cbText').onclick=async()=>{if(!csel)return;const r=cropRect(),i=csel.p;let t='';try{t=await cropText();}catch(e){}
  if(t.replace(/\s/g,'').length>=3){showText(t,i,false,r);return;}
  showModal(`<div class="modal-title">Bu hissədə mətn qatı yoxdur</div><div style="color:#bbb;font-size:14px;line-height:1.5">Seçilmiş hissəni OCR ilə oxuya bilərəm (internet lazımdır, düsturlar dəqiq çıxmaya bilər).</div><div class="modal-actions"><button class="btn" id="ocNo">Xeyr</button><button class="btn primary" id="ocYes">OCR et</button></div>`,true);
  $('#ocNo').onclick=hideModal;$('#ocYes').onclick=()=>runOcr(i,r);};

/* ---- Video idarə paneli: barmaqla ekranda istənilən yerə daşınır ---- */
const fmt=t=>{t=Math.max(0,t|0);return(t/60|0)+':'+String(t%60).padStart(2,'0');};
let seeking=false;const vc=$('#customVideoControls'),seek=$('#customSeekBar');
$('#customPlayBtn').onclick=()=>{if(activeVideo)activeVideo.paused?activeVideo.play():activeVideo.pause();};
seek.oninput=e=>{seeking=true;if(!activeVideo||!activeVideo.duration)return;const t=e.target.value/100*activeVideo.duration;activeVideo.currentTime=t;$('#customCurrentTime').textContent=fmt(t);};
seek.onchange=()=>{seeking=false;};
{let g=null;const h=$('#dragHandle');
  h.addEventListener('pointerdown',e=>{const r=vc.getBoundingClientRect();g={x:e.clientX-r.left,y:e.clientY-r.top};
    vc.style.transform='none';vc.style.bottom='auto';vc.style.left=r.left+'px';vc.style.top=r.top+'px';h.setPointerCapture(e.pointerId);e.preventDefault();});
  h.addEventListener('pointermove',e=>{if(!g)return;vc.style.left=clamp(e.clientX-g.x,0,innerWidth-vc.offsetWidth)+'px';vc.style.top=clamp(e.clientY-g.y,0,innerHeight-vc.offsetHeight)+'px';e.preventDefault();});
  h.addEventListener('pointerup',()=>g=null);h.addEventListener('pointercancel',()=>g=null);}

function flushAll(){if(!item)return;
  if(kind==='video'){if(activeVideo)putPos(item.id,{v:activeVideo.currentTime||0});}
  else{savePos();if(dirty)dbPutAnn(item.id,strokes);}}
window.addEventListener('pagehide',flushAll);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll();});
